<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AYV + Ravelo logo cream check</title>
    <style>
      body {
        margin: 0;
        padding: 48px;
        background: #fafaf9;
        color: #080503;
        font-family: Georgia, serif;
      }
      .row {
        display: flex;
        gap: 64px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
      }
      img {
        display: block;
        object-fit: contain;
        background: transparent;
      }
      figcaption {
        margin-top: 12px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <figure>
        <img src="http://localhost:3000/brands/ayv/logo.png" width="320" height="320" alt="AYV hero" />
        <figcaption>AYV hero 320</figcaption>
      </figure>
      <figure>
        <img src="http://localhost:3000/brands/ravelo/logo.png" width="208" height="208" alt="Ravelo page" />
        <figcaption>Ravelo page 208</figcaption>
      </figure>
      <figure>
        <img src="http://localhost:3000/brands/ravelo/logo.png" width="72" height="72" alt="Ravelo card" />
        <figcaption>Ravelo card 72</figcaption>
      </figure>
    </div>
  </body>
</html>
